openapi: 3.1.0
info:
  title: VeriTrace Telemetry API
  version: 0.2.0
  summary: Cold-chain readings, incidents, and the real-time notification WebSocket.
  description: |
    Conventions, error codes, and the endpoint inventory are defined in
    `veritrace/docs/contracts/rest-api.md`; the WebSocket protocol is defined in
    `veritrace/docs/contracts/messaging.md`. Each endpoint's schema is added here together
    with its implementation (contract first).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000
    description: Local gateway
security:
  - bearerAuth: []
tags:
  - name: Telemetry
    description: |
      Readings and cold-chain incidents of the shipments that the caller's tenant takes part in. Drivers see only the
      shipments assigned to them (`docs/domain/access-control.md`). A shipment the caller may not see answers 404.
  - name: Notifications
    description: |
      The real-time WebSocket (`docs/contracts/messaging.md` §6). Its messages are described by the
      `Notification*` and `ClientMessage` schemas.
paths:
  /api/v1/telemetry/shipments/{sscc}/readings:
    parameters:
      - $ref: "#/components/parameters/SSCC"
    get:
      operationId: getReadings
      tags: [Telemetry]
      summary: Read a shipment's readings
      description: |
        Readings recorded in `[from, to)`, oldest first. `raw` returns every stored reading of every device; `1m` and
        `15m` return the average, minimum, and maximum temperature per bucket, and `15m` reads the continuous
        aggregate. The window defaults to the last hour (`raw`), day (`1m`), or week (`15m`) before `to`, which
        defaults to now, and may be at most 6 hours (`raw`), 7 days (`1m`), or 90 days (`15m`).

        A malformed SSCC answers `422 INVALID_GS1_IDENTIFIER`; a shipment the telemetry service does not know, or in
        which the caller's tenant takes no part, answers 404; a driver who is not assigned to it gets 403.
      parameters:
        - name: resolution
          in: query
          schema:
            type: string
            enum: [raw, 1m, 15m]
            default: raw
        - name: from
          in: query
          description: Start of the window, inclusive.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of the window, exclusive. Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The readings of the window.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingSeries"
              example:
                sscc: "089300010000000018"
                resolution: 1m
                from: "2026-09-01T14:00:00Z"
                to: "2026-09-01T15:00:00Z"
                items:
                  - bucket: "2026-09-01T14:30:00Z"
                    avg_temperature_celsius: 9.42
                    min_temperature_celsius: 9.2
                    max_temperature_celsius: 9.6
                    reading_count: 12
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/telemetry/shipments/{sscc}/incidents:
    parameters:
      - $ref: "#/components/parameters/SSCC"
    get:
      operationId: listShipmentIncidents
      tags: [Telemetry]
      summary: List a shipment's incidents
      description: The cold-chain incidents of one shipment, newest first. Errors as for the readings.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of incidents.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/telemetry/incidents:
    get:
      operationId: listIncidents
      tags: [Telemetry]
      summary: List incidents
      description: |
        Newest first: the cold-chain incidents of the shipments that the caller's tenant takes part in. A `DRIVER` sees
        only the shipments assigned to it. `state=open` keeps the ongoing incidents, `state=resolved` the ended ones.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          schema:
            type: string
            enum: [open, resolved]
      responses:
        "200":
          description: A page of incidents.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/telemetry/incidents/summary:
    get:
      operationId: getIncidentSummary
      tags: [Telemetry]
      summary: Count incidents
      description: |
        Of the shipments that the caller sees as in `listIncidents`: the incidents still open, and those confirmed in
        the last 24 hours.
      responses:
        "200":
          description: The counts.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentSummary"
              example:
                open_count: 1
                last_24h_count: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/telemetry/shipments/{sscc}/warnings:
    parameters:
      - $ref: "#/components/parameters/SSCC"
    get:
      operationId: listShipmentWarnings
      tags: [Telemetry]
      summary: List a shipment's excursion warnings
      description: |
        The excursion warnings of one shipment, newest first (`docs/domain/cold-chain-monitoring.md` §7). Errors as for
        the readings.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of warnings.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/telemetry/shipments/{sscc}/thermal-exposure:
    parameters:
      - $ref: "#/components/parameters/SSCC"
    get:
      operationId: getThermalExposure
      tags: [Telemetry]
      summary: Read a shipment's thermal exposure and shelf-life estimate
      description: |
        The thermal exposure of a shipment over its readings until the end of its monitoring, or until now while it
        is monitored, and the shelf life that it cost the goods (`docs/domain/cold-chain-monitoring.md` §8).
        `shelf_life` is `null` for a shipment created before shipments carried the lot's production date and Q10.
        Errors as for the readings.
      responses:
        "200":
          description: The exposure.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermalExposure"
              example:
                sscc: "089300010000000018"
                assessed_at: "2026-09-01T17:30:00Z"
                monitoring_ended: true
                min_temp_celsius: 2
                max_temp_celsius: 8
                reading_count: 2520
                first_reading_at: "2026-09-01T14:00:00Z"
                last_reading_at: "2026-09-01T17:29:55Z"
                covered_seconds: 12595
                uncovered_seconds: 0
                mean_temperature_celsius: 15.92
                mean_kinetic_temperature_celsius: 18.47
                lowest_temperature_celsius: 4.3
                highest_temperature_celsius: 22.1
                time_above_max_seconds: 10850
                time_below_min_seconds: 0
                degree_minutes_above_max: 2520.4
                degree_minutes_below_min: 0
                shelf_life:
                  shelf_life_q10: 3
                  production_date: "2026-09-01"
                  label_expiration_date: "2026-09-14"
                  estimated_expiration_date: "2026-09-14"
                  shelf_life_loss_hours: 10.97
                  shelf_life_loss_percent: 3.26
                  remaining_shelf_life_hours: 307.53
                  status: REDUCED
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/telemetry/warnings:
    get:
      operationId: listWarnings
      tags: [Telemetry]
      summary: List excursion warnings
      description: |
        Newest first: the excursion warnings of the shipments that the caller sees as in `listIncidents`.
        `state=open` keeps the open warnings, `state=closed` those with an outcome.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          schema:
            type: string
            enum: [open, closed]
      responses:
        "200":
          description: A page of warnings.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/telemetry/warnings/performance:
    get:
      operationId: getWarningPerformance
      tags: [Telemetry]
      summary: Measure the forecast quality of excursion warnings
      description: |
        Over `[from, to)`, for the shipments that the caller sees as in `listIncidents`, or for one of them
        (`docs/domain/cold-chain-monitoring.md` §7.3): warnings issued in the period by outcome, incidents started in
        the period and those that a warning preceded, precision, recall, lead times, and the error of the predicted
        excursion time. `to` defaults to now and `from` to 7 days before it; the window is at most 90 days. An `sscc`
        that the caller may not see answers as for the readings.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: sscc
          in: query
          schema:
            type: string
            pattern: "^[0-9]{18}$"
      responses:
        "200":
          description: The forecast quality.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningPerformance"
              example:
                from: "2026-08-25T00:00:00Z"
                to: "2026-09-01T00:00:00Z"
                sscc: null
                warnings:
                  issued: 24
                  open: 1
                  breached: 15
                  cleared: 6
                  inconclusive: 2
                incidents:
                  count: 17
                  warned: 15
                precision: 0.7143
                recall: 0.8824
                lead_time_seconds:
                  median: 245
                  min: 40
                  mean: 251.3
                mean_excursion_time_error_seconds: 58.4
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /ws/v1/notifications:
    get:
      operationId: openNotifications
      tags: [Notifications]
      summary: Open the notification WebSocket
      description: |
        A WebSocket upgrade (`docs/contracts/messaging.md` §6). Browsers cannot set headers on WebSocket requests, so
        the client offers the subprotocols `veritrace.v1` and `bearer.<access token>`, and the server selects
        `veritrace.v1`. A request from another origin than the gateway's own or one listed in `WS_ALLOWED_ORIGINS`
        is refused with 403 before the upgrade, and a request that does not offer `veritrace.v1` with 400.

        After the upgrade the server closes the connection with `4401` if the token is missing, invalid, or expired,
        and again when the token expires; `4400` for a message that is not a JSON text frame of at most 4 KiB;
        `4403` after a `FORBIDDEN` error; `4408` for a 21st subscription; `1001` at shutdown; and `1013` while
        tokens cannot be verified. It pings every 30 s and disconnects a client that does not answer within 10 s.
        Server messages are `NotificationMessage`; client messages are `ClientMessage`.
      security: []
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          description: "`veritrace.v1, bearer.<access token>`"
          schema:
            type: string
      responses:
        "101":
          description: Switching to the WebSocket protocol `veritrace.v1`.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The origin is not allowed.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA-signed access token issued by core-business-service and verified through its JWKS.
  parameters:
    SSCC:
      name: sscc
      in: path
      required: true
      description: The shipment's SSCC-18.
      schema:
        type: string
        pattern: "^[0-9]{18}$"
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
  headers:
    TraceId:
      description: Trace ID of the request, for support and log correlation.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem document with VeriTrace extensions.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Unprocessable Content
        status:
          type: integer
          example: 422
        code:
          type: string
          description: Stable machine-readable error code.
          example: NOT_FOUND
        detail:
          type: string
        instance:
          type: string
          example: /api/v1/telemetry/incidents
        trace_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: gtin
        code:
          type: string
          example: CHECK_DIGIT
        message:
          type: string
    Position:
      type: object
      description: Device-reported WGS-84 position.
      required: [latitude, longitude, accuracy_meters]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracy_meters:
          type: number
          minimum: 0
    Reading:
      type: object
      required: [recorded_at, device_id, temperature_celsius, humidity_percent, latitude, longitude]
      properties:
        recorded_at:
          type: string
          format: date-time
          description: Device time.
        device_id:
          type: string
        temperature_celsius:
          type: number
        humidity_percent:
          type: [number, "null"]
        latitude:
          type: number
        longitude:
          type: number
    ReadingBucket:
      type: object
      required: [bucket, avg_temperature_celsius, min_temperature_celsius, max_temperature_celsius, reading_count]
      properties:
        bucket:
          type: string
          format: date-time
          description: Start of the minute or quarter hour.
        avg_temperature_celsius:
          type: number
          description: Rounded to two decimals.
        min_temperature_celsius:
          type: number
        max_temperature_celsius:
          type: number
        reading_count:
          type: integer
    ReadingSeries:
      type: object
      required: [sscc, resolution, from, to, items]
      properties:
        sscc:
          type: string
        resolution:
          type: string
          enum: [raw, 1m, 15m]
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        items:
          description: Oldest first. `Reading` items for `raw`, `ReadingBucket` items otherwise.
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/Reading"
            - type: array
              items:
                $ref: "#/components/schemas/ReadingBucket"
    Incident:
      type: object
      description: |
        A breached episode (`docs/domain/cold-chain-monitoring.md`): confirmed 30 s after the first out-of-bounds
        reading, and ended by a reading in bounds, by a gap of more than 15 s (at the last reading), or when the
        shipment stopped being monitored. `incident_hash` covers the confirmation fields (`messaging.md` §5).
      required:
        - id
        - shipment_id
        - sscc
        - device_id
        - started_at
        - confirmed_at
        - ended_at
        - duration_seconds
        - min_temp_celsius
        - max_temp_celsius
        - trigger_temperature_celsius
        - extreme_temperature_celsius
        - latitude
        - longitude
        - incident_hash
        - product_name
        - gtin
        - lot_number
      properties:
        id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        sscc:
          type: string
        device_id:
          type: string
          description: The device whose reading confirmed the breach.
        started_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
          description: "`null` while the incident is open."
        duration_seconds:
          type: [integer, "null"]
          description: Whole seconds from start to end; `null` while the incident is open.
        min_temp_celsius:
          type: number
          description: The lower bound in force.
        max_temp_celsius:
          type: number
          description: The upper bound in force.
        trigger_temperature_celsius:
          type: number
          description: The temperature of the confirming reading.
        extreme_temperature_celsius:
          type: number
          description: The temperature furthest from the bounds so far.
        latitude:
          type: number
        longitude:
          type: number
        incident_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        product_name:
          type: string
        gtin:
          type: string
        lot_number:
          type: string
    IncidentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to read the next page; `null` on the last page.
    IncidentSummary:
      type: object
      required: [open_count, last_24h_count]
      properties:
        open_count:
          type: integer
        last_24h_count:
          type: integer
          description: Incidents confirmed in the last 24 hours, open or resolved.
    Warning:
      type: object
      description: |
        An excursion warning (`docs/domain/cold-chain-monitoring.md` §7): issued when the temperature trend reaches a
        bound within 10 minutes, and closed as `BREACHED` (a breach was confirmed while it was open), `CLEARED` (the
        trend turned), or `INCONCLUSIVE` (the shipment stopped being monitored).
      required:
        - id
        - shipment_id
        - sscc
        - device_id
        - issued_at
        - bound
        - bound_celsius
        - temperature_celsius
        - slope_celsius_per_minute
        - predicted_excursion_at
        - closed_at
        - outcome
        - incident_id
        - lead_time_seconds
        - product_name
        - gtin
        - lot_number
      properties:
        id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        sscc:
          type: string
        device_id:
          type: string
          description: The device whose reading issued the warning.
        issued_at:
          type: string
          format: date-time
        bound:
          $ref: "#/components/schemas/WarningBound"
        bound_celsius:
          type: number
          description: The value of the bound.
        temperature_celsius:
          type: number
          description: The temperature of the reading that issued the warning.
        slope_celsius_per_minute:
          type: number
          description: The slope of the trend; positive toward `MAX`, negative toward `MIN`.
        predicted_excursion_at:
          type: string
          format: date-time
        closed_at:
          type: [string, "null"]
          format: date-time
          description: "`null` while the warning is open."
        outcome:
          oneOf:
            - $ref: "#/components/schemas/WarningOutcome"
            - type: "null"
          description: "`null` while the warning is open."
        incident_id:
          type: [string, "null"]
          format: uuid
          description: The incident of a `BREACHED` warning.
        lead_time_seconds:
          type: [integer, "null"]
          description: For a `BREACHED` warning, the whole seconds from the warning to the start of the breach's episode.
        product_name:
          type: string
        gtin:
          type: string
        lot_number:
          type: string
    WarningBound:
      type: string
      description: "`MAX` for a rising temperature, `MIN` for a falling one."
      enum: [MAX, MIN]
    WarningOutcome:
      type: string
      enum: [BREACHED, CLEARED, INCONCLUSIVE]
    WarningPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to read the next page; `null` on the last page.
    WarningPerformance:
      type: object
      required:
        - from
        - to
        - sscc
        - warnings
        - incidents
        - precision
        - recall
        - lead_time_seconds
        - mean_excursion_time_error_seconds
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        sscc:
          type: [string, "null"]
          description: The shipment measured, or `null` for every shipment of the caller.
        warnings:
          type: object
          description: Warnings issued in the period, by outcome; `open` have none yet.
          required: [issued, open, breached, cleared, inconclusive]
          properties:
            issued:
              type: integer
            open:
              type: integer
            breached:
              type: integer
            cleared:
              type: integer
            inconclusive:
              type: integer
        incidents:
          type: object
          description: Incidents that started in the period, and those that a warning was closed as `BREACHED` with.
          required: [count, warned]
          properties:
            count:
              type: integer
            warned:
              type: integer
        precision:
          type: [number, "null"]
          description: "`breached / (breached + cleared)`, four decimals; `null` without either."
        recall:
          type: [number, "null"]
          description: "`incidents.warned / incidents.count`, four decimals; `null` without incidents."
        lead_time_seconds:
          description: Lead times of the `BREACHED` warnings; `null` without any.
          oneOf:
            - type: object
              required: [median, min, mean]
              properties:
                median:
                  type: number
                min:
                  type: number
                mean:
                  type: number
            - type: "null"
        mean_excursion_time_error_seconds:
          type: [number, "null"]
          description: Mean of `|started_at − predicted_excursion_at|` over the `BREACHED` warnings; `null` without any.
    ThermalExposure:
      type: object
      description: |
        Readings of all devices merge in device-time order; each stands for the time until the next one, at most
        15 s, and the rest of a longer gap is uncovered. Temperatures in °C, two decimals.
      required:
        - sscc
        - assessed_at
        - monitoring_ended
        - min_temp_celsius
        - max_temp_celsius
        - reading_count
        - first_reading_at
        - last_reading_at
        - covered_seconds
        - uncovered_seconds
        - mean_temperature_celsius
        - mean_kinetic_temperature_celsius
        - lowest_temperature_celsius
        - highest_temperature_celsius
        - time_above_max_seconds
        - time_below_min_seconds
        - degree_minutes_above_max
        - degree_minutes_below_min
        - shelf_life
      properties:
        sscc:
          type: string
        assessed_at:
          type: string
          format: date-time
          description: The time the exposure runs to.
        monitoring_ended:
          type: boolean
          description: Whether the shipment had stopped being monitored by then.
        min_temp_celsius:
          type: number
        max_temp_celsius:
          type: number
        reading_count:
          type: integer
        first_reading_at:
          type: [string, "null"]
          format: date-time
        last_reading_at:
          type: [string, "null"]
          format: date-time
        covered_seconds:
          type: integer
        uncovered_seconds:
          type: integer
        mean_temperature_celsius:
          type: [number, "null"]
          description: Time-weighted; `null` without covered time.
        mean_kinetic_temperature_celsius:
          type: [number, "null"]
          description: Mean kinetic temperature (USP <1079>, ΔH = 83.144 kJ/mol); `null` without covered time.
        lowest_temperature_celsius:
          type: [number, "null"]
        highest_temperature_celsius:
          type: [number, "null"]
        time_above_max_seconds:
          type: integer
        time_below_min_seconds:
          type: integer
        degree_minutes_above_max:
          type: number
          description: Sum of the time above the maximum times the degrees above it, in °C·min.
        degree_minutes_below_min:
          type: number
        shelf_life:
          oneOf:
            - $ref: "#/components/schemas/ShelfLife"
            - type: "null"
    ShelfLife:
      type: object
      description: |
        The label shelf life runs from the start of the production date to the end of the expiration date (UTC).
        Above `max_temp_celsius` the goods age `shelf_life_q10^((T − max) / 10)` times as fast; the extra aging moves
        the expiry earlier. Hours and percentages have two decimals.
      required:
        - shelf_life_q10
        - production_date
        - label_expiration_date
        - estimated_expiration_date
        - shelf_life_loss_hours
        - shelf_life_loss_percent
        - remaining_shelf_life_hours
        - status
      properties:
        shelf_life_q10:
          type: number
        production_date:
          type: string
          format: date
        label_expiration_date:
          type: string
          format: date
        estimated_expiration_date:
          type: string
          format: date
          description: The day of the last moment before the estimated expiry.
        shelf_life_loss_hours:
          type: number
          description: The extra aging.
        shelf_life_loss_percent:
          type: number
          description: The extra aging as a percentage of the label shelf life.
        remaining_shelf_life_hours:
          type: number
          description: From the assessment time to the estimated expiry; negative once it has passed.
        status:
          $ref: "#/components/schemas/ShelfLifeStatus"
    ShelfLifeStatus:
      type: string
      description: "`EXPIRED` when no shelf life remains, `REDUCED` from a loss of 1 %, otherwise `INTACT`."
      enum: [INTACT, REDUCED, EXPIRED]
    NotificationMessage:
      description: |
        A server message on the notification WebSocket (`messaging.md` §6.1). Its `type` decides the shape of `data`,
        so generated clients get one variant per type.
      oneOf:
        - $ref: "#/components/schemas/BreachConfirmedMessage"
        - $ref: "#/components/schemas/BreachResolvedMessage"
        - $ref: "#/components/schemas/WarningIssuedMessage"
        - $ref: "#/components/schemas/WarningClosedMessage"
        - $ref: "#/components/schemas/ShelfLifeReducedMessage"
        - $ref: "#/components/schemas/RecallMessage"
        - $ref: "#/components/schemas/ReadingMessage"
        - $ref: "#/components/schemas/SubscriptionMessage"
        - $ref: "#/components/schemas/ErrorMessage"
      discriminator:
        propertyName: type
        mapping:
          cold_chain.breach_confirmed: "#/components/schemas/BreachConfirmedMessage"
          cold_chain.breach_resolved: "#/components/schemas/BreachResolvedMessage"
          cold_chain.warning_issued: "#/components/schemas/WarningIssuedMessage"
          cold_chain.warning_closed: "#/components/schemas/WarningClosedMessage"
          cold_chain.shelf_life_reduced: "#/components/schemas/ShelfLifeReducedMessage"
          shipment.recalled: "#/components/schemas/RecallMessage"
          telemetry.reading: "#/components/schemas/ReadingMessage"
          subscribed: "#/components/schemas/SubscriptionMessage"
          unsubscribed: "#/components/schemas/SubscriptionMessage"
          error: "#/components/schemas/ErrorMessage"
    NotificationEnvelope:
      type: object
      description: The members that every server message has besides `type` and `data`.
      required: [id, sent_at]
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the event behind the message, so a repeated event can be recognized.
        sent_at:
          type: string
          format: date-time
    BreachConfirmedMessage:
      allOf:
        - $ref: "#/components/schemas/NotificationEnvelope"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [cold_chain.breach_confirmed]
            data:
              $ref: "#/components/schemas/NotificationBreachConfirmed"
    BreachResolvedMessage:
      allOf:
        - $ref: "#/components/schemas/NotificationEnvelope"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [cold_chain.breach_resolved]
            data:
              $ref: "#/components/schemas/NotificationBreachResolved"
    WarningIssuedMessage:
      allOf:
        - $ref: "#/components/schemas/NotificationEnvelope"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [cold_chain.warning_issued]
            data:
              $ref: "#/components/schemas/NotificationWarningIssued"
    WarningClosedMessage:
      allOf:
        - $ref: "#/components/schemas/NotificationEnvelope"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [cold_chain.warning_closed]
            data:
              $ref: "#/components/schemas/NotificationWarningClosed"
    ShelfLifeReducedMessage:
      allOf:
        - $ref: "#/components/schemas/NotificationEnvelope"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [cold_chain.shelf_life_reduced]
            data:
              $ref: "#/components/schemas/NotificationShelfLifeReduced"
    RecallMessage:
      allOf:
        - $ref: "#/components/schemas/NotificationEnvelope"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [shipment.recalled]
            data:
              $ref: "#/components/schemas/NotificationRecall"
    ReadingMessage:
      allOf:
        - $ref: "#/components/schemas/NotificationEnvelope"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [telemetry.reading]
            data:
              $ref: "#/components/schemas/NotificationReading"
    SubscriptionMessage:
      allOf:
        - $ref: "#/components/schemas/NotificationEnvelope"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [subscribed, unsubscribed]
            data:
              $ref: "#/components/schemas/NotificationSubscription"
    ErrorMessage:
      allOf:
        - $ref: "#/components/schemas/NotificationEnvelope"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [error]
            data:
              $ref: "#/components/schemas/NotificationError"
    NotificationBreachConfirmed:
      type: object
      description: "`cold_chain.breach_confirmed`: the event data of `messaging.md` §5 with the shipment's product."
      required:
        - incident_id
        - shipment_id
        - sscc
        - device_id
        - started_at
        - confirmed_at
        - min_temp_celsius
        - max_temp_celsius
        - temperature_celsius
        - latitude
        - longitude
        - incident_hash
        - product_name
        - gtin
      properties:
        incident_id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        sscc:
          type: string
        device_id:
          type: string
        started_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
        min_temp_celsius:
          type: number
        max_temp_celsius:
          type: number
        temperature_celsius:
          type: number
        latitude:
          type: number
        longitude:
          type: number
        incident_hash:
          type: string
        product_name:
          type: string
        gtin:
          type: string
    NotificationBreachResolved:
      type: object
      description: "`cold_chain.breach_resolved`: the event data of `messaging.md` §5."
      required: [incident_id, sscc, ended_at, duration_seconds, extreme_temperature_celsius]
      properties:
        incident_id:
          type: string
          format: uuid
        sscc:
          type: string
        ended_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
        extreme_temperature_celsius:
          type: number
    NotificationWarningIssued:
      type: object
      description: "`cold_chain.warning_issued`: the event data of `messaging.md` §7 with the shipment's product."
      required:
        - warning_id
        - shipment_id
        - sscc
        - device_id
        - issued_at
        - bound
        - bound_celsius
        - temperature_celsius
        - slope_celsius_per_minute
        - predicted_excursion_at
        - product_name
        - gtin
      properties:
        warning_id:
          type: string
          format: uuid
        shipment_id:
          type: string
          format: uuid
        sscc:
          type: string
        device_id:
          type: string
        issued_at:
          type: string
          format: date-time
        bound:
          $ref: "#/components/schemas/WarningBound"
        bound_celsius:
          type: number
        temperature_celsius:
          type: number
        slope_celsius_per_minute:
          type: number
        predicted_excursion_at:
          type: string
          format: date-time
        product_name:
          type: string
        gtin:
          type: string
    NotificationWarningClosed:
      type: object
      description: "`cold_chain.warning_closed`: the event data of `messaging.md` §7."
      required: [warning_id, sscc, closed_at, outcome, incident_id, lead_time_seconds]
      properties:
        warning_id:
          type: string
          format: uuid
        sscc:
          type: string
        closed_at:
          type: string
          format: date-time
        outcome:
          $ref: "#/components/schemas/WarningOutcome"
        incident_id:
          type: [string, "null"]
          format: uuid
        lead_time_seconds:
          type: [integer, "null"]
    NotificationShelfLifeReduced:
      type: object
      description: "`cold_chain.shelf_life_reduced`: the event data of `messaging.md` §7."
      required:
        - shipment_id
        - sscc
        - status
        - assessed_at
        - shelf_life_q10
        - label_expiration_date
        - estimated_expiration_date
        - shelf_life_loss_hours
        - shelf_life_loss_percent
        - remaining_shelf_life_hours
      properties:
        shipment_id:
          type: string
          format: uuid
        sscc:
          type: string
        status:
          type: string
          enum: [REDUCED, EXPIRED]
        assessed_at:
          type: string
          format: date-time
        shelf_life_q10:
          type: number
        label_expiration_date:
          type: string
          format: date
        estimated_expiration_date:
          type: string
          format: date
        shelf_life_loss_hours:
          type: number
        shelf_life_loss_percent:
          type: number
        remaining_shelf_life_hours:
          type: number
    NotificationRecall:
      type: object
      description: "`shipment.recalled`, delivered to the users who may view the shipment."
      required: [shipment_id, sscc, recall_id, gtin, lot_number, product_name, reason]
      properties:
        shipment_id:
          type: string
          format: uuid
        sscc:
          type: string
        recall_id:
          type: string
          format: uuid
        gtin:
          type: string
        lot_number:
          type: string
        product_name:
          type: string
        reason:
          type: string
    NotificationReading:
      type: object
      description: "`telemetry.reading`: a reading of a subscribed SSCC, as it is recorded (`messaging.md` §4)."
      required: [device_id, sscc, recorded_at, temperature_celsius, humidity_percent, latitude, longitude]
      properties:
        device_id:
          type: string
        sscc:
          type: string
        recorded_at:
          type: string
          format: date-time
        temperature_celsius:
          type: number
        humidity_percent:
          type: [number, "null"]
        latitude:
          type: number
        longitude:
          type: number
    NotificationSubscription:
      type: object
      description: "`subscribed` and `unsubscribed`: the answer to a client message."
      required: [channel, sscc]
      properties:
        channel:
          type: string
          enum: [telemetry]
        sscc:
          type: string
    NotificationError:
      type: object
      description: |
        `error`: a client message that could not be followed. `NOT_FOUND` for a shipment the caller may not see,
        `FORBIDDEN` for a driver's shipment that is not assigned to it (the connection then closes with 4403), and
        `INVALID_MESSAGE` for an unknown type or channel or a malformed SSCC.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [FORBIDDEN, NOT_FOUND, INVALID_MESSAGE]
        message:
          type: string
    ClientMessage:
      type: object
      description: A client message on the notification WebSocket (`messaging.md` §6.2). At most 20 subscriptions.
      required: [type, channel, sscc]
      properties:
        type:
          type: string
          enum: [subscribe, unsubscribe]
        channel:
          type: string
          enum: [telemetry]
        sscc:
          type: string
          pattern: "^[0-9]{18}$"
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, invalid, or expired credentials.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller may see the resource but may not perform the action.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: The request is well-formed but violates a domain rule.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Access tokens cannot be verified right now, or the service is shutting down; retry shortly.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected failure; details are in the service logs under the trace ID.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
