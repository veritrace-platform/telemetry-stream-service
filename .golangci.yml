version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    misspell:
      # The MQTT broker.
      ignore-rules:
        - mosquitto
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: context-as-argument
    sloglint:
      no-mixed-args: true
      attr-only: true
      context: scope
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
      - path: internal/platform/postgres/postgrestest/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/veritrace-platform
